services:
  velaris:
    container_name: velaris
    image: velaris-web:${VELARIS_VERSION:-1.0.0}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VELARIS_VERSION: ${VELARIS_VERSION:-1.0.0}
        VELARIS_COMMIT: ${VELARIS_COMMIT:-local}
    restart: unless-stopped
    ports:
      - "${VELARIS_PORT:-8097}:8080"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    stop_grace_period: 10s
