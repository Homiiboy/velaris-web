<div data-role="page" class="page standalonePage velaris-auth-page">
    <div class="velaris-auth-shell">
        <div class="velaris-auth-brand" aria-label="Velaris">
            <span class="velaris-auth-brand__mark" aria-hidden="true"></span>
            <span class="velaris-auth-brand__wordmark">VELARIS</span>
        </div>

        <form class="addServerForm velaris-auth-panel velaris-server-form" novalidate>
            <div class="velaris-auth-heading">
                <span class="velaris-auth-eyebrow">VELARIS ACCESS</span>
                <h1>${HeaderConnectToServer}</h1>
            </div>

            <div class="inputContainer">
                <input is="emby-input" type="url" id="txtServerHost" required="required" label="${LabelServerHost}"/>
                <div class="fieldDescription">${LabelServerHostHelp}</div>
            </div>

            <button is="emby-button" type="submit" class="raised button-submit block">
                <span>${Connect}</span>
            </button>
            <button is="emby-button" type="button" class="raised button-cancel block btnCancel">
                <span>${ButtonCancel}</span>
            </button>
        </form>
    </div>
</div>
