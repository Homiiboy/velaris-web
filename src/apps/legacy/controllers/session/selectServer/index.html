<div id="selectServerPage" data-role="page" class="page noSecondaryNavPage standalonePage pageContainer velaris-auth-page velaris-server-page">
    <div class="velaris-auth-shell">
        <div class="velaris-auth-brand" aria-label="Velaris">
            <span class="velaris-auth-brand__mark" aria-hidden="true"></span>
            <span class="velaris-auth-brand__wordmark">VELARIS</span>
        </div>

        <div class="verticalSection velaris-server-panel flex-shrink-zero w-100 flex flex-direction-column">
            <div class="velaris-auth-heading">
                <span class="velaris-auth-eyebrow">VELARIS ACCESS</span>
                <h1 class="sectionTitle sectionTitle-cards velaris-auth-title">${SelectServer}</h1>
            </div>

            <div class="padded-top padded-bottom-focusscale flex-grow flex" data-horizontal="true" data-centerfocus="card">
                <div is="emby-itemscontainer" class="scrollSlider focuscontainer-x servers flex-grow" data-hovermenu="false" data-multiselect="false"></div>
            </div>

            <div class="padded-top flex flex-shrink-zero justify-content-center flex-wrap-wrap margin-auto-x">
                <a is="emby-linkbutton" href="#/addserver" class="raised cancel btnAddServer flex-shrink-zero">
                    <span>${ButtonAddServer}</span>
                </a>
            </div>
        </div>
    </div>
</div>
