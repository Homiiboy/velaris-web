<div data-role="page" class="page standalonePage forgotPasswordPinPage velaris-auth-page">
    <div class="velaris-auth-shell">
        <div class="velaris-auth-brand" aria-label="Velaris">
            <span class="velaris-auth-brand__mark" aria-hidden="true"></span>
            <span class="velaris-auth-brand__wordmark">VELARIS</span>
        </div>

        <form class="forgotPasswordPinForm velaris-auth-panel velaris-reset-form">
            <div class="velaris-auth-heading">
                <span class="velaris-auth-eyebrow">VELARIS PROFILE</span>
                <h2>${HeaderPasswordReset}</h2>
            </div>

            <div class="inputContainer">
                <input is="emby-input" type="text" id="txtPin" label="${LabelPasswordRecoveryPinCode}" autocomplete="off" required="required"/>
            </div>

            <button is="emby-button" type="submit" class="raised submit block">
                <span>${ButtonSubmit}</span>
            </button>

            <button is="emby-button" type="button" class="raised cancel block btnCancel" onclick="history.back();">
                <span>${ButtonCancel}</span>
            </button>
        </form>
    </div>
</div>
