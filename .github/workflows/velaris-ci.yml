name: Velaris CI

on:
  push:
    branches:
      - velaris
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate and build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run build:check

      - name: ESLint
        run: npm run lint

      - name: Velaris strict lint
        run: >-
          npx eslint
          src/apps/legacy/controllers/session/login/index.js
          src/apps/legacy/routes/user/userprofile.tsx
          src/apps/modern/AppLayout.tsx
          src/apps/modern/features/controlCenter
          src/apps/modern/features/discovery
          src/apps/modern/features/franchises
          src/apps/modern/features/home
          src/apps/modern/features/insights
          src/apps/modern/features/profiles
          src/apps/modern/features/releaseHub
          src/apps/modern/features/tv
          src/apps/modern/utils/velarisNavigation.ts
          src/apps/modern/utils/velarisNavigation.test.ts
          src/apps/modern/utils/velarisRouting.ts
          src/apps/modern/utils/velarisRouting.test.ts
          src/apps/modern/utils/velarisStorage.ts
          src/apps/modern/routes/asyncRoutes/user.ts
          src/apps/modern/routes/controlCenter.tsx
          src/apps/modern/routes/discovery.tsx
          src/apps/modern/routes/franchise.tsx
          src/apps/modern/routes/franchiseStudio.tsx
          src/apps/modern/routes/home.tsx
          src/apps/modern/routes/insights.tsx
          src/apps/modern/routes/releaseHub.tsx
          src/apps/modern/components/AppToolbar/index.tsx
          src/apps/modern/components/AppToolbar/userViews/UserViewNav.tsx
          src/apps/modern/components/AppToolbar/userViews/UserViewsMenu.tsx
          src/apps/modern/components/drawers/MainDrawerContent.tsx
          src/components/ConnectionErrorPage.tsx
          src/components/playback/skipsegment.ts
          src/components/playback/velarisAdvancedPlayer.ts
          src/components/playback/velarisAdvancedPlayer.test.ts
          src/components/playback/velarisAdvancedPlayerController.ts
          src/components/playback/velarisTvPlayerController.ts
          src/components/toolbar/AppUserMenu.tsx
          --max-warnings=0

      - name: Stylelint
        run: npm run stylelint

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build:production

      - name: ES compatibility check
        run: npm run escheck
