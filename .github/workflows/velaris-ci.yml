name: Velaris CI

on:
  push:
    branches:
      - velaris
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate and build
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production dependency audit
        run: npm audit --omit=dev --omit=optional --audit-level=critical

      - name: TypeScript check
        run: npm run build:check

      - name: ESLint
        run: npm run lint

      - name: Velaris strict lint
        run: >-
          npx eslint
          src/apps/legacy/controllers/session/login/index.js
          src/apps/legacy/routes/user/userprofile.tsx
          src/apps/modern/AppLayout.tsx
          src/apps/modern/features/controlCenter
          src/apps/modern/features/discovery
          src/apps/modern/features/franchises
          src/apps/modern/features/home
          src/apps/modern/features/insights
          src/apps/modern/features/profiles
          src/apps/modern/features/releaseHub
          src/apps/modern/features/tv
          src/apps/modern/utils/velarisNavigation.ts
          src/apps/modern/utils/velarisNavigation.test.ts
          src/apps/modern/utils/velarisRouting.ts
          src/apps/modern/utils/velarisRouting.test.ts
          src/apps/modern/utils/velarisStorage.ts
          src/apps/modern/routes/asyncRoutes/user.ts
          src/apps/modern/routes/controlCenter.tsx
          src/apps/modern/routes/discovery.tsx
          src/apps/modern/routes/franchise.tsx
          src/apps/modern/routes/franchiseStudio.tsx
          src/apps/modern/routes/home.tsx
          src/apps/modern/routes/insights.tsx
          src/apps/modern/routes/releaseHub.tsx
          src/apps/modern/components/AppToolbar/index.tsx
          src/apps/modern/components/AppToolbar/userViews/UserViewNav.tsx
          src/apps/modern/components/AppToolbar/userViews/UserViewsMenu.tsx
          src/apps/modern/components/drawers/AppDrawer.tsx
          src/apps/modern/components/drawers/AppDrawer.test.ts
          src/apps/modern/components/drawers/appDrawerRouting.ts
          src/apps/modern/components/drawers/MainDrawerContent.tsx
          src/components/ConnectionErrorPage.tsx
          src/components/ListItemLink.tsx
          src/components/ResponsiveDrawer.tsx
          src/components/ResponsiveDrawer.test.ts
          src/components/playback/skipsegment.ts
          src/components/playback/velarisAdvancedPlayer.ts
          src/components/playback/velarisAdvancedPlayer.test.ts
          src/components/playback/velarisAdvancedPlayerController.ts
          src/components/playback/velarisTvPlayerController.ts
          src/components/playback/velarisTvPlayerController.test.ts
          src/components/playback/velarisTvPlayerFocus.ts
          src/components/toolbar/AppUserMenu.tsx
          --max-warnings=0

      - name: Stylelint
        run: npm run stylelint

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build:production

      - name: ES compatibility check
        run: npm run escheck

      - name: Docker Compose validation
        run: docker compose config --quiet

      - name: Docker image build
        run: >-
          docker build
          --build-arg VELARIS_VERSION="$(cat VELARIS_VERSION)"
          --build-arg VELARIS_COMMIT="${GITHUB_SHA}"
          --tag velaris-web:ci
          .

      - name: Docker runtime smoke test
        run: |
          set -eu
          trap 'docker rm -f velaris-ci >/dev/null 2>&1 || true' EXIT
          docker run -d \
            --name velaris-ci \
            --read-only \
            --tmpfs /tmp:size=64m,mode=1777 \
            --security-opt no-new-privileges:true \
            --cap-drop ALL \
            -p 127.0.0.1:18097:8080 \
            velaris-web:ci

          attempt=1
          while [ "$attempt" -le 15 ]; do
            if curl --fail --silent http://127.0.0.1:18097/healthz >/dev/null; then
              exit 0
            fi
            sleep 1
            attempt=$((attempt + 1))
          done

          docker logs velaris-ci
          exit 1

  publish-container:
    name: Publish GHCR image
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/velaris'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout validated commit
        uses: actions/checkout@v4

      - name: Resolve image tags
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          version="$(tr -d '[:space:]' < VELARIS_VERSION)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "VELARIS_VERSION must contain a stable semantic version, got: $version" >&2
            exit 1
          fi

          image="ghcr.io/homiiboy/velaris-web"
          short_sha="$(git rev-parse --short=12 HEAD)"
          full_sha="$(git rev-parse HEAD)"
          subject="$(git log -1 --pretty=%s)"

          {
            echo "image=$image"
            echo "version=$version"
            echo "commit=$full_sha"
            echo 'tags<<EOF'
            echo "$image:latest"
            echo "$image:sha-$short_sha"
            if [[ "$subject" == release\(velaris\):* ]]; then
              echo "$image:$version"
              echo "$image:${version%.*}"
            fi
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish multi-platform image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            VELARIS_VERSION=${{ steps.meta.outputs.version }}
            VELARIS_COMMIT=${{ steps.meta.outputs.commit }}
          cache-from: type=gha,scope=velaris-container
          cache-to: type=gha,mode=max,scope=velaris-container
